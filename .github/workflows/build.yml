name: Build ZealOS ISOs

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '**/LICENSE'
  pull_request:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '**/LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential git xorriso qemu-system-x86

      - name: Enable KVM Group Perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run ISOs Build Script
        timeout-minutes: 30
        if: ${{ success() }}
        run: |
          cd build
          ./build-iso.sh --headless
          cd ..

      - name: Keep only the BIOS+UEFI ISO (one file for boot, test and install)
        if: ${{ success() }}
        run: |
          cd build
          mv ZealOS-BSD2-UEFI-*.iso HolyTempleOS.iso
          rm -f ZealOS-PublicDomain-BIOS-*.iso
          ls -la *.iso
          cd ..

      - name: ISO Check
        if: ${{ success() && hashFiles('./build/HolyTempleOS.iso') == '' }}
        run: |
          echo "ISO not built!"
          exit 1

      - name: Upload ISO (downloadable from the run page)
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: HolyTempleOS-ISO
          path: ./build/HolyTempleOS.iso

      - name: Releasing Latest ISO
        if: ${{ success() && github.event_name == 'push'}}
        uses: "GutPuncher/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: false
          title: "Holy TempleOS ISO [${{ github.sha }}] (BIOS + UEFI, installer included)"
          files: ./build/HolyTempleOS.iso

      - name: OK
        if: ${{ success() }}
        run: |
          echo "Build OK"
